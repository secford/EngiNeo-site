<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiNeo — Админ-панель</title>
    <link rel="icon" type="image/png" href="image/logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <img src="image/logo.png" alt="EngiNeo">
                <span>EngiNeo</span>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="admin.html" class="nav-link active">Админ</a>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="my-orders.html" class="cart-btn">
                    <i class="fas fa-box"></i>
                </a>
                <button id="logoutBtn" style="display:none;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:0.9rem;margin-left:0.5rem">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Форма логина -->
    <section class="admin-login-section" id="loginSection">
        <div class="container">
            <div class="login-form-wrapper" style="max-width:400px;margin:4rem auto;padding:2rem;background:var(--bg-card);border-radius:12px;border:1px solid var(--border-color)">
                <h2 style="text-align:center;margin-bottom:1.5rem">Вход в админ-панель</h2>
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="Логин" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                </div>
                <button class="btn btn-primary btn-full" id="loginBtn">Войти</button>
                <p id="loginError" style="color:var(--danger);text-align:center;margin-top:0.5rem;display:none"></p>
            </div>
        </div>
    </section>

    <!-- Панель управления (скрыта до авторизации) -->
    <section class="admin-section" id="adminPanel" style="display:none">
        <div class="container">
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="orders">Заказы</button>
                <button class="admin-tab" data-tab="products">Товары</button>
                <button class="admin-tab" data-tab="stats">Статистика</button>
            </div>

            <div class="admin-content" id="tab-orders">
                <div class="admin-filters">
                    <select id="statusFilter">
                        <option value="">Все статусы</option>
                        <option value="pending">Новый</option>
                        <option value="processing">В обработке</option>
                        <option value="printing">Печать</option>
                        <option value="quality-check">Проверка</option>
                        <option value="ready">Готов</option>
                        <option value="shipped">Отправлен</option>
                        <option value="delivered">Доставлен</option>
                        <option value="cancelled">Отменён</option>
                    </select>
                    <input type="text" id="searchOrder" placeholder="Поиск по номеру заказа...">
                </div>
                <div class="orders-table-container">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>№</th>
                                <th>Дата</th>
                                <th>Товар</th>
                                <th>Кол-во</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr><td colspan="7" class="loading">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="admin-content" id="tab-products" style="display:none">
                <div class="admin-filters">
                    <select id="categoryFilter">
                        <option value="">Все категории</option>
                        <option value="figurines">Фигурки</option>
                        <option value="decoration">Декор</option>
                        <option value="technical">Технические</option>
                        <option value="accessories">Аксессуары</option>
                        <option value="toys">Игрушки</option>
                    </select>
                    <button class="btn btn-primary" id="addProductBtn">
                        <i class="fas fa-plus"></i> Добавить товар
                    </button>
                </div>
                <div class="products-grid" id="adminProductsGrid">
                    <p>Загрузка товаров...</p>
                </div>
            </div>

            <div class="admin-content" id="tab-stats" style="display:none">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
                        <div class="stat-value" id="totalOrders">0</div>
                        <div class="stat-label">Всего заказов</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-ruble-sign"></i></div>
                        <div class="stat-value" id="totalRevenue">0 ₽</div>
                        <div class="stat-label">Общий доход</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
                        <div class="stat-value" id="avgProfit">0 ₽</div>
                        <div class="stat-label">Средняя прибыль</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-percentage"></i></div>
                        <div class="stat-value" id="avgMargin">0%</div>
                        <div class="stat-label">Средняя маржа</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Модалка деталей заказа -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Заказ <span id="modalOrderNumber"></span></h2>
                <button class="modal-close" onclick="closeOrderModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalOrderDetails"></div>
        </div>
    </div>

    <!-- Модалка добавления товара -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Добавить товар</h2>
                <button class="modal-close" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="form-group">
                        <label>Название товара</label>
                        <input type="text" id="prodTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="prodDescription" rows="3"></textarea>
                    </div>
                    <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                        <div class="form-group">
                            <label>Цена (₽)</label>
                            <input type="number" id="prodPrice" min="0" step="1" required>
                        </div>
                        <div class="form-group">
                            <label>Категория</label>
                            <select id="prodCategory">
                                <option value="figurines">Фигурки</option>
                                <option value="decoration">Декор</option>
                                <option value="technical">Технические</option>
                                <option value="accessories">Аксессуары</option>
                                <option value="toys">Игрушки</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Материалы (через запятую: pla,petg,abs)</label>
                        <input type="text" id="prodMaterials" value="pla,petg,abs">
                    </div>
                    <div class="form-group">
                        <label>Цвета (через запятую)</label>
                        <input type="text" id="prodColors" value="Красный,Синий,Чёрный">
                    </div>
                    <div class="form-group">
                        <label>Значок (например: Хит, Новинка)</label>
                        <input type="text" id="prodBadge">
                    </div>
                    <div class="form-group">
                        <label>Иконка FontAwesome (например: fa-cube, fa-dragon)</label>
                        <input type="text" id="prodImage" value="fa-cube">
                    </div>
                    <div class="form-group">
                        <label>STL файл (3D модель)</label>
                        <div class="file-upload">
                            <input type="file" id="prodStlFile" accept=".stl" style="display:none">
                            <label for="prodStlFile" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1rem;border:2px dashed var(--border-color);border-radius:8px;cursor:pointer;transition:var(--transition)">
                                <i class="fas fa-upload"></i>
                                <span id="stlFileName">Выберите STL файл</span>
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full" id="submitProductBtn">Сохранить товар</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 EngiNeo. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="js/admin.js"></script>
</body>
</html>
